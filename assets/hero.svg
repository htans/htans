<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="DeokKeun Song — Full-Stack Developer">
  <style>
    @font-face { font-family: "Archivo"; font-weight: 900; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "JBMono"; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "NotoKR"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
    .mono { font-family: "JBMono", ui-monospace, Menlo, Consolas, monospace; font-weight: 600; letter-spacing: .08em; }
    .disp { font-family: "Archivo", "Arial Black", sans-serif; font-weight: 900; }
    .kr { font-family: "NotoKR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight: 500; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .rec { animation: blink 1.6s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink, .rec { animation: none; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f5c542" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ebe7df" opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="16" fill="#0d1013"/>
  <rect width="1200" height="420" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="16" fill="url(#scan)"/>

  <!-- 뷰파인더 모서리 -->
  <g fill="none" stroke="#ebe7df" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <path d="M28 64V28h36"/><path d="M1136 28h36v36"/>
    <path d="M28 356v36h36"/><path d="M1172 356v36h-36"/>
  </g>

  <!-- 키캡 로고 -->
  <g transform="translate(64 58)">
    <rect y="5" width="40" height="40" rx="8" fill="#a8831f"/>
    <rect width="40" height="40" rx="8" fill="#f5c542"/>
    <text x="20" y="28" text-anchor="middle" class="disp" font-size="20" fill="#0d1013">S</text>
    <text x="56" y="28" class="mono" font-size="15" fill="#8b939b" letter-spacing="1">SONG <tspan fill="#ebe7df">DEOKKEUN</tspan></text>
  </g>

  <!-- REC -->
  <g transform="translate(1136 84)" text-anchor="end">
    <text class="mono" font-size="14" fill="#ebe7df">REC  /  SEOUL · KST</text>
    <circle class="rec" cx="-176" cy="-5" r="6" fill="#ff3b30"/>
  </g>

  <!-- 이름 -->
  <text x="64" y="176" class="mono" font-size="16" fill="#f5c542">FULL-STACK DEVELOPER</text>
  <text x="60" y="282" class="disp" font-size="104" textLength="920" lengthAdjust="spacingAndGlyphs">
    <tspan fill="none" stroke="#ebe7df" stroke-width="2.5">DeokKeun</tspan><tspan dx="28" fill="#f5c542">Song</tspan>
  </text>
  <rect class="blink" x="1006" y="206" width="14" height="78" fill="#f5c542"/>

  <text x="64" y="340" class="kr" font-size="22" fill="#ebe7df" fill-opacity=".78">개발과 데이터 사용가치에 대해 관심이 있습니다.</text>

  <!-- ON AIR -->
  <g transform="translate(1136 352)" text-anchor="end">
    <text class="mono" font-size="13" fill="#8b939b">ON AIR — www.deokkeunsong.com</text>
  </g>
</svg>
